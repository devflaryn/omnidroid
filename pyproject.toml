[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidroid"
version = "0.1.0"
description = "Multi-account Android (Roblox) instance manager"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
omnidroid = "omnidroid.cli:main"

[tool.setuptools]
py-modules = ["manager"]

[tool.setuptools.packages.find]
include = ["omnidroid*"]
