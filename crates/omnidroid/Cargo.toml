[package]
name = "omnidroid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "The omnidroid app: warm Android devices, any APK run on them in windows of its own, and an MCP server for coding agents."

# A launcher, and only that: which APK (omni-apk), where the app's storage lives (omni-platform),
# the root module catalog and request (omni-linux's `root` module: file work only, no boot) and then
# the gate's own run. No OS crate and no `cfg(target_os)` here (Global Constraint 4) --
# what differs per host is answered by omni-platform.
[dependencies]
omni-apk = { workspace = true }
omni-platform = { workspace = true }
# `aosp` on the host's warm device when one is up (src/warm.rs): no boot of its own.
omni-warm = { workspace = true }
# The root module catalog and request (`omnidroid modules`, `aosp --root`): host-side file work only.
omni-linux = { workspace = true }
# The app (`omnidroid` with no command): the pool of warm devices and instances, its MCP server
# (HTTP on 127.0.0.1, the lab's tools beside the pool's), and its full-screen terminal UI --
# ratatui over crossterm, which draws on the Windows console and Unix terminals alike, so this crate
# still holds no platform code of its own.
omni-pool = { workspace = true }
omni-mcp = { workspace = true }
parking_lot = { workspace = true }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "0.28.1"

[[bin]]
name = "omnidroid"
path = "src/main.rs"
