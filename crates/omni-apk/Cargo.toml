[package]
name = "omni-apk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "APK/zip reading and the content-addressed, 4 KB-aligned native-library extraction cache (D11)."

# Pure file and compute work, with exactly one question for the platform: the host page size, which
# decides whether an entry can be mapped straight out of the archive. That goes through
# `omni-platform`, which is the seam working as intended — Global Constraint 4 forbids OS-specific
# crates (`windows-sys`, `libc`) outside `omni-platform`, not `omni-platform` itself. No other OS
# API is reached, and this crate is still `#![forbid(unsafe_code)]`.
[dependencies]
omni-platform = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }
crc32fast = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }

# The synthetic-zip tests build archives byte by byte (they need a deflate *compressor*, which the
# crate itself never uses), and the fixture tests re-hash a cache file independently of the code
# under test.
[dev-dependencies]
crc32fast = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
