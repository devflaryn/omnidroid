[package]
name = "omni-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "An MCP server (Model Context Protocol, over stdio) that lets any MCP-capable agent drive omnidroid: lifecycle, session and emulation-layer debugging/dumping tools."

# A top-level tool binary, not a core crate. It wires the emulation-layer debugger (omni-debug) to
# an MCP stdio transport and shells out to the `omnidroid` launcher for live instances. It carries
# its own small JSON implementation rather than adding serde: the project hand-parses JSON elsewhere
# (main.rs: "without a JSON crate"), MCP's messages are simple, and keeping the dependency tree
# unchanged means the other two machines rebuild nothing new. No cfg(target_os) and no OS crate here.
[dependencies]
omni-debug = { workspace = true }
omni-apk = { workspace = true }
omni-platform = { workspace = true }
# An APK is known by its bytes' hash (the warm device's install decision).
sha2 = { workspace = true }

[lib]
name = "omni_mcp"
path = "src/lib.rs"

[[bin]]
name = "omni-mcp"
path = "src/main.rs"
