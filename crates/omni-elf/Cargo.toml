[package]
name = "omni-elf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "AArch64 ELF64 parsing and the Android APS2 packed-relocation decoder (D9)."

# No OS-specific crates and no `cfg(target_os)`: the parser works entirely from a `&[u8]` and the
# loader reaches memory only through `omni-mem`, which reaches the OS only through `omni-platform`.
# Global Constraint 4 is satisfied structurally rather than by discipline.
[dependencies]
thiserror = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true }
omni-mem = { workspace = true }

[dev-dependencies]
# Test-only, and deliberately not a real dependency. The loader needs `process_commit_charge` and
# nothing else from the platform seam, and `omni-mem` re-exports it — because a crate that holds
# `omni_platform::vm` in scope also holds `vm::protect`, `vm::unmap` and `vm::map_file`, which are
# unsafe to call on a guest address without the region map that only `omni-mem` has. The
# commit-charge test binary measures the process directly, which is what a test is for.
omni-platform = { workspace = true }
# The golden fixtures are the ARM64 `.so` entries inside the real APK, which are
# DEFLATE-compressed; the parsing tests inflate them in-process, while the loader tests need them
# as 4 KB-aligned files on disk and so go through the real extraction cache.
flate2 = { workspace = true }
omni-apk = { workspace = true }
