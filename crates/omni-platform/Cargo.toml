[package]
name = "omni-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "OS primitives for Omnidroid. The only crate permitted to use cfg(target_os) or OS APIs."

[dependencies]
thiserror = { workspace = true }

[features]
# `hypervisor`: the Hypervisor.framework seam (src/hypervisor), and the stage-2 mirror's hook in
# vm/macos.rs. Off by default: only `omni-cpu`'s `native-hvf` turns it on, so a default build neither
# links the framework nor carries the hook. Implemented on macOS on Apple silicon; elsewhere every
# entry point refuses by name.
hypervisor = []

# Structural unix backends only need sysconf(_SC_PAGESIZE); see src/vm/unix.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    # `BCryptGenRandom` for the process seam's entropy. The system-preferred RNG rather than an
    # algorithm handle this crate would have to open and hold; see src/process/windows.rs.
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    # The process seam's `host_manufacturer`: `RegGetValueW` on the firmware's own record.
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # The window seam (src/window/windows.rs). `Win32_Graphics_Gdi` is not for drawing: `WNDCLASSW`
    # carries an `HBRUSH` background field, so the struct itself is behind that feature even when
    # the brush is null -- which it is, because the swapchain owns every pixel of the client area.
    # `Win32_UI_HiDpi` is one call, `SetProcessDpiAwarenessContext`, without which `GetClientRect`
    # reports virtualised pixels on a scaled display and every swapchain extent is wrong.
    # The network seam (src/net/windows.rs). Winsock is the whole of it: `socket`, `bind`,
    # `connect`, `getsockopt`/`setsockopt` and `select` -- the five calls `std::net` has no
    # spelling for, because `std` cannot make a socket that is not already connected or bound and
    # has no readiness call at all. `WSAStartup` is here too: a raw `socket(2)` in a process where
    # nothing has initialised Winsock fails with WSANOTINITIALISED, and this seam may well make
    # the first network call the runtime makes.
    "Win32_Networking_WinSock",
    # `net::interface_addresses`: `GetAdaptersAddresses`, whose adapter structure is declared
    # behind the NDIS feature as well (its interface-type and media fields are NDIS types).
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    # Raw input (`RegisterRawInputDevices`, `GetRawInputData`): the window seam's pointer capture,
    # whose motion is the mouse's own counts. Named although `Win32_UI_Input_KeyboardAndMouse`
    # implies it, so that the dependency is stated where it is used.
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # The audio seam (src/audio/windows.rs): WASAPI, which is COM. `windows-sys` carries no COM
    # *methods*, so the four vtables are declared by hand there; these features are for everything
    # else. `Win32_Media_Audio` is the enumerator's CLSID, `WAVEFORMATEX`/`WAVEFORMATEXTENSIBLE`
    # and the `AUDCLNT_*` constants. `Win32_System_Com` is `CoInitializeEx`, `CoIncrementMTAUsage`
    # (what lets the stream be driven from a thread other than the one that opened it),
    # `CoCreateInstance`, and `CoTaskMemFree` for the mix format `GetMixFormat` allocates.
    "Win32_Media_Audio",
    "Win32_System_Com",
    # The two spellings of "the mix format is float": `WAVE_FORMAT_IEEE_FLOAT` and the
    # `KSDATAFORMAT_SUBTYPE_IEEE_FLOAT` an extensible format carries instead.
    "Win32_Media_Multimedia",
    # One constant, `WAVE_FORMAT_EXTENSIBLE` (and `KSDATAFORMAT_SUBTYPE_PCM`, for the unit test that
    # proves a 32-bit extensible format is refused unless its subtype is float).
    "Win32_Media_KernelStreaming",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# window + audio seams (macOS)
#
# AppKit, for the window seam (src/window/macos.rs and src/window/macos/*.rs): `objc2` is the
# Objective-C runtime binding -- message sends, `define_class!` for the one view class the backend
# needs, `Retained` for ownership -- and the framework crates are typed bindings over it, so that a
# selector's arguments are checked by the compiler rather than by a crash at run time. Features are
# named rather than defaulted: `objc2-app-kit`'s default is the whole framework, several thousand
# classes, for a backend that touches a dozen. `objc2-quartz-core` is `CAMetalLayer`, the layer
# `VK_EXT_metal_surface` presents to. The CoreAudio, CoreGraphics, CoreFoundation and libdispatch
# calls are a handful of C functions each and are declared by hand where they are used.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSAttributedString", "NSBundle", "NSDate", "NSError", "NSGeometry",
    "NSNotification", "NSObject", "NSRange", "NSRunLoop", "NSString", "NSURL", "NSURLRequest", "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation", "objc2-quartz-core", "NSApplication", "NSCursor", "NSEvent", "NSGraphics", "NSResponder",
    "NSRunningApplication", "NSScreen", "NSTextInputClient", "NSTrackingArea", "NSView", "NSWindow",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation", "CALayer", "CAMetalLayer",
] }
# The web view seam (src/webview/macos.rs): `WKWebView`, its configuration and user scripts, the
# navigation delegate and the script-message handler the page's `postMessage` arrives through.
# `block2` is the completion handler of `evaluateJavaScript:completionHandler:`.
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKFrameInfo", "WKNavigation",
    "WKNavigationDelegate", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController",
    "WKUserScript", "WKWebView", "WKWebViewConfiguration",
] }
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# window + audio seams (macOS): `tests/window_keys_macos.rs` checks the backend's key table against
# the one consumer of `WindowEvent::KeyDown.scancode`, `omni_android::jni::keys::evdev_code`, key by
# key. A dev-dependency cycle (omni-android depends on this crate), which Cargo supports and which
# `omni-gfx`'s manifest already relies on; `omni-cpu` is built without dynarmic through it.
omni-android = { workspace = true }
# `tests/screen_capture_macos.rs` presents with omni-gfx's renderer and captures the screen, which
# is where a macOS-only capture belongs: omni-gfx may not name a platform.
omni-gfx = { workspace = true }
