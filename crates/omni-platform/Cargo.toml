[package]
name = "omni-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "OS primitives for Omnidroid. The only crate permitted to use cfg(target_os) or OS APIs."

[dependencies]
thiserror = { workspace = true }

# Structural unix backends only need sysconf(_SC_PAGESIZE); see src/vm/unix.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Linux window seam (src/window/linux.rs): Xlib, XKB and XInput 2, loaded with `dlopen` at the
# first window rather than linked, so that a machine with no X libraries still builds and runs
# everything that is not a window. MIT (D3).
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

# `tests/window_linux.rs` plays a window manager's part -- sending the close message a manager
# sends, reading back properties -- on a connection of its own.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11-dl = "2.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    # `BCryptGenRandom` for the process seam's entropy. The system-preferred RNG rather than an
    # algorithm handle this crate would have to open and hold; see src/process/windows.rs.
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    # The process seam's `host_manufacturer`: `RegGetValueW` on the firmware's own record.
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # The window seam (src/window/windows.rs). `Win32_Graphics_Gdi` is not for drawing: `WNDCLASSW`
    # carries an `HBRUSH` background field, so the struct itself is behind that feature even when
    # the brush is null -- which it is, because the swapchain owns every pixel of the client area.
    # `Win32_UI_HiDpi` is one call, `SetProcessDpiAwarenessContext`, without which `GetClientRect`
    # reports virtualised pixels on a scaled display and every swapchain extent is wrong.
    # The network seam (src/net/windows.rs). Winsock is the whole of it: `socket`, `bind`,
    # `connect`, `getsockopt`/`setsockopt` and `select` -- the five calls `std::net` has no
    # spelling for, because `std` cannot make a socket that is not already connected or bound and
    # has no readiness call at all. `WSAStartup` is here too: a raw `socket(2)` in a process where
    # nothing has initialised Winsock fails with WSANOTINITIALISED, and this seam may well make
    # the first network call the runtime makes.
    "Win32_Networking_WinSock",
    # `net::interface_addresses`: `GetAdaptersAddresses`, whose adapter structure is declared
    # behind the NDIS feature as well (its interface-type and media fields are NDIS types).
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    # Raw input (`RegisterRawInputDevices`, `GetRawInputData`): the window seam's pointer capture,
    # whose motion is the mouse's own counts. Named although `Win32_UI_Input_KeyboardAndMouse`
    # implies it, so that the dependency is stated where it is used.
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # The audio seam (src/audio/windows.rs): WASAPI, which is COM. `windows-sys` carries no COM
    # *methods*, so the four vtables are declared by hand there; these features are for everything
    # else. `Win32_Media_Audio` is the enumerator's CLSID, `WAVEFORMATEX`/`WAVEFORMATEXTENSIBLE`
    # and the `AUDCLNT_*` constants. `Win32_System_Com` is `CoInitializeEx`, `CoIncrementMTAUsage`
    # (what lets the stream be driven from a thread other than the one that opened it),
    # `CoCreateInstance`, and `CoTaskMemFree` for the mix format `GetMixFormat` allocates.
    "Win32_Media_Audio",
    "Win32_System_Com",
    # The two spellings of "the mix format is float": `WAVE_FORMAT_IEEE_FLOAT` and the
    # `KSDATAFORMAT_SUBTYPE_IEEE_FLOAT` an extensible format carries instead.
    "Win32_Media_Multimedia",
    # One constant, `WAVE_FORMAT_EXTENSIBLE` (and `KSDATAFORMAT_SUBTYPE_PCM`, for the unit test that
    # proves a 32-bit extensible format is refused unless its subtype is float).
    "Win32_Media_KernelStreaming",
] }
