[package]
name = "omni-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The guest address space, and `admit` — the one copy of "may guest code touch this range". The
# thunk boundary validates every pointer the guest hands it through that function rather than
# through a second copy of the rules (Global Constraint 11, and the reason M4 deduplicated them).
omni-mem = { workspace = true }
# `GuestCpu` and the thunk seam. Note what is **not** here: no `dynarmic-sys`, and nothing
# target-gated. This crate must compile for all five targets without `cfg`
# (`ARCHITECTURE.md` section 2), which is exactly why the boundary is written against
# `ThunkCall`/`ThunkRegs` and not against the translating backend's types.
#
# `default-features = false` is load-bearing, and the **path is spelled out rather than inherited**
# because of a Cargo rule that is easy to miss: with `workspace = true`, a member's
# `default-features = false` is *ignored* — Cargo says so in a warning — so inheriting here would have
# switched the translating backend on for the whole workspace. That would have made
# `cargo build --workspace --no-default-features`, the one command that proves no C++ toolchain is
# needed, silently stop meaning anything. `omni-cpu` carries the mirror image of this arrangement in
# its dev-dependency on itself, for the same reason.
omni-cpu = { path = "../omni-cpu", default-features = false }
# The loader's `SymbolProvider`, which is how imports get bound to thunk addresses at load time.
omni-elf = { workspace = true }
# The bionic libc/libm implementations themselves (D19). The dependency direction is
# `omni-android` -> `omni-bionic`, which is downward, and `omni-bionic` depends on nothing at
# all -- so nothing here can reach the OS through it.
omni-bionic = { workspace = true }
thiserror = { workspace = true }
# The thunk table is built while the loader resolves symbols, from `&self`, and dispatched from
# guest threads afterwards.
parking_lot = { workspace = true }
# `omni-bionic`'s `Futex` trait wants "block on a guest address until woken", which is a parking
# lot keyed by that address. Writing a second one out of a HashMap of Condvars would be
# re-deriving the registration/sleep window, and the one defect already found in the sync layer
# was a lost wake.
parking_lot_core = { workspace = true }

[dev-dependencies]
# The translating backend, **for test targets only**. The boundary's assertions are about real
# translated ARM64 code branching into a real thunk region; a mock would assert facts about the
# mock. With resolver = "2" a dev-dependency's features reach only the test targets, so the
# `--no-default-features` guarantee above survives.
omni-cpu = { path = "../omni-cpu", default-features = false, features = ["dynarmic"] }
# Tests only, and for the same reason `omni-cpu`'s suites carry them: the boundary's assertions are
# about a **live** guest — real translated ARM64 code branching into a real thunk region — and a
# mock would assert facts about the mock. `omni-apk` is for the real-APK fixture (Global
# Constraint 2).
omni-apk = { workspace = true }
omni-platform = { workspace = true }
