[package]
name = "omni-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `omni-mem` for `GuestAddr` and `GuestSpace`: the CPU is handed a guest address space, and the two
# crates must agree on what an address is. Nothing else. In particular there is deliberately **no**
# build script and no C or C++ dependency here (preflight ruling P1): the dynarmic FFI lives in
# `dynarmic-sys`, so this crate — and therefore the `GuestCpu` trait — compiles on a host with no
# C++ toolchain at all, which is what the ARM64-native path (ARCHITECTURE.md section 6) needs.
omni-mem = { workspace = true }
thiserror = { workspace = true }
# `TlsArena` hands blocks out from several guest threads at once; its free list needs a lock.
parking_lot = { workspace = true }

# The translating backend needs the guest address space itself, not just its extent: to decide
# whether a guest address is executable before fetching an instruction from it, and to own guest
# demand paging (D10) through omni-mem's `DemandPager`.

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
# **Optional, and target-gated, so preflight ruling P1 still holds where it was aimed.** P1 put the
# dynarmic FFI in its own crate so that `omni-cpu` — and therefore the `GuestCpu` trait — compiles
# on a host with no C++ toolchain, which is what the ARM64-native path needs. That property is
# unchanged: on an `aarch64` host this dependency does not exist at all, and on any host
# `--no-default-features` gives the trait with no backend.
#
# It is a dependency here, rather than in a later task, because Task 3's deliverables are
# *assertions about a live configuration* — zero callback-path entries, a startup check that fires,
# a thread pointer guest code can read — and none of them can be written against a backend that
# does not exist.
dynarmic-sys = { workspace = true, optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
# **Optional, off by default**: the native backend (`native-hvf`) runs guest code on the host's own
# cores under a hardware VM, which only an arm64 host can do, and reaches the hypervisor through
# omni-platform's `hypervisor` seam -- the only place an OS API may be called. P1 is untouched: no
# C or C++ toolchain is involved, and without the feature this dependency does not exist.
omni-platform = { workspace = true, optional = true, features = ["hypervisor"] }

[dev-dependencies]
# Tests only. `omni-platform` is where the vectored-handler seam lives, and the fault tests assert
# that Omnidroid's handler really ran (D10) rather than inferring it. Depending on `omni-platform`
# is the seam working as intended, not a Global Constraint 4 violation — the constraint forbids
# `windows-sys`/`libc` outside it.
omni-platform = { workspace = true }

# A dev-dependency on ourselves, which is how a crate turns a feature on for its own test targets
# without turning it on for anybody who depends on it. `test-support` gates
# `DynarmicBackend::create_misconfigured_thread`, whose whole job is to bypass the D4 startup
# assertion; `#[cfg(test)]` cannot gate it, because integration tests are separate crates and would
# lose access along with production code. With this, the integration tests can reach it and a
# release build of the runtime cannot.
#
# `default-features = false` is load-bearing: without it this dependency switches the default
# features back on for the whole package, and `--no-default-features` silently stops meaning
# anything — the backend gets compiled and the C++ toolchain gets invoked by the one command that
# exists to prove neither is needed.
omni-cpu = { path = ".", default-features = false, features = ["test-support"] }

# **Test targets only**, for the M2 gate: it runs a function out of the real `libroblox.so`, which
# has to be extracted from the real APK (`omni-apk`) and loaded, relocated and RELRO-sealed
# (`omni-elf`) first. Neither is a dependency of this crate's own code, and neither may become one:
# `ARCHITECTURE.md` section 2 puts `omni-cpu` and `omni-elf` side by side with nothing between
# them, and a runtime edge either way would invert that. A dev-dependency is test-only by
# construction, and `omni-elf` already carries the mirror image of this arrangement with
# `omni-apk`.
omni-elf = { workspace = true }
omni-apk = { workspace = true }

[features]
default = ["dynarmic"]
# The translating backend. See the dependency comment above.
dynarmic = ["dep:dynarmic-sys"]
# Exposes the deliberate-misconfiguration constructor that proves the D4 startup assertion fires.
# **Never enable this outside a test target.** See `dynarmic::DynarmicBackend`.
test-support = []
# The native backend (`src/native`): Hypervisor.framework, guest at EL0, stage 2 at IPA == VA. arm64
# hosts only; implemented on macOS on Apple silicon, a typed refusal elsewhere. Off by default and
# never the default backend: see docs/ports/macos-hvf.md and its D31 draft. Test binaries that use it
# must be signed with `com.apple.security.hypervisor` (tools/hvf_run.sh as the cargo runner).
native-hvf = ["dep:omni-platform"]
