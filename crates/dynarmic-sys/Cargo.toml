[package]
name = "dynarmic-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Raw FFI bindings to the pinned dynarmic A64 JIT (yuzu-mirror/dynarmic@9d45823)."
# Declaring the native library stops two copies of dynarmic being linked into
# one binary if a second crate ever wraps it.
links = "od_dynarmic"
build = "build.rs"

[features]
# Build dynarmic's code cache W^X rather than PAGE_EXECUTE_READWRITE. Off by
# default because it is off upstream, and refused unless
# OMNIDROID_DYNARMIC_ALLOW_BROKEN_WX=1 because it crashes on this pin: see
# `README.md` item 4 (W^X) and `patches/README.md` "Known candidates" item 3.
w-xor-x = []

[build-dependencies]
cc = "1.4.6"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
