[package]
name = "omni-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "The Linux kernel personality: the arm64 syscall ABI under the real AOSP bionic, linker64 and (later) ART."

[dependencies]
omni-platform = { workspace = true }
omni-mem = { workspace = true }
omni-elf = { workspace = true }
omni-cpu = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
# /proc/config.gz (`crate::procfs`).
flate2 = { workspace = true }
# The host's Vulkan, loaded at run time (`crate::gpu`); as omni-gfx loads it (its Cargo.toml says why).
ash = { version = "0.38", default-features = false, features = ["loaded"] }
# The host's EGL and GLES for the GL backend (`crate::gpu::gl`), loaded at run time: the loader
# `ash`'s `loaded` already brings in, and the Global Constraint 4 exception omni-gfx's manifest
# records for its GLES host, for the same reason (a GPU API with no loader crate of its own).
libloading = "0.8"
# Zip-form root modules (`crate::root::module`): pure file/compute, no unsafe.
omni-apk = { workspace = true }
# The guest's copied images on the host's clipboard (`crate::clipboard`): decoded by a memory-safe
# decoder, within size limits, and encoded again as a fresh PNG -- the guest's file never reaches the
# host. Only the formats an Android clip carries an image in; nothing else is decoded.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# `--features mimalloc`: `omni-linux-run`'s heap is mimalloc instead of the platform's (Windows'
# HeapAlloc). Off by default -- an A/B build (`tests/alloc_cost.rs` measures both). From the
# registry cache; no network needed (`cargo build --offline`). MEASURED (E-cores): a small
# alloc+free 50 -> 8 ns, a 4 KiB one 55 -> 37, but ~630 KiB committed per thread that allocates
# a few small sizes (a 64 KiB page per size class) against ~75 KiB -- ~0.5 GB more for the system
# host process's ~950 threads; MIMALLOC_EAGER_COMMIT=0 / MIMALLOC_ARENA_EAGER_COMMIT=0 do not help.
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[features]
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "omni-linux-run"
path = "src/bin/omni-linux-run.rs"

[dev-dependencies]
